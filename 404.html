<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found · Pulse</title>
  <meta name="description" content="Page not found.">
  <meta name="theme-color" content="#0b1020">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="aurora" aria-hidden="true">
    <span class="aurora-blob b1"></span>
    <span class="aurora-blob b2"></span>
    <span class="aurora-blob b3"></span>
  </div>

  <header class="site-header">
    <div class="container header-row">
      <a class="brand" href="./" aria-label="Pulse home">
        <span class="brand-mark" aria-hidden="true"><span class="brand-dot"></span></span>
        <span class="brand-name">Pulse</span>
      </a>
      <nav class="site-nav" aria-label="Sections">
        <a href="/#status">Status</a>
        <a href="/#changelog">Changelog</a>
        <a href="/#incidents">Incidents</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero" style="min-height: 70vh; display: flex; align-items: center;">
      <div class="container" style="text-align: center;">
        <div class="hero-copy" style="max-width: 600px; margin: 0 auto;">
          <h1 class="hero-title" style="margin-bottom: 24px;">Page not found</h1>
          <p class="hero-sub" style="font-size: 1.1rem; margin-bottom: 32px;">
            The page you're looking for doesn't exist or has been moved.
          </p>
          <a href="./" class="cta-button" style="display: inline-flex; align-items: center; gap: 10px; padding: 14px 28px; background: linear-gradient(135deg, var(--accent-2), var(--accent) 55%, var(--accent-3)); color: white; text-decoration: none; font-weight: 600; border-radius: 12px; font-size: 1rem; transition: transform 0.2s, box-shadow 0.2s; box-shadow: 0 0 24px rgba(99, 102, 241, 0.4);">
            Back to status
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-row">
      <p><strong>Pulse</strong> is a static changelog and status page. Everything on it comes from <code>data/changelog.json</code>.</p>
      <p class="footer-meta">Managed in Elixion · changes land through pull requests</p>
    </div>
  </footer>
</body>
</html>
